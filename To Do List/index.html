<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="heading">
        <!-- You can add a navbar here using Bootstrap if needed -->
    </div>

    <div class="list text-center">
        <p>To Do List</p>
        <input type="text" class="form-control mb-3" placeholder="Enter Your Task">
        <button id="save" class="btn mb-2">Save</button>
        <button id="view" class="btn">View Your Task</button>
    </div>

    <!-- Bootstrap JS Bundle (optional, only if you want Bootstrap's JS functionality like modals) -->
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
